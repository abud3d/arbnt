<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجتمع ARBNT — شبكة العرب</title><link rel="stylesheet" href="assets/shell.css"><style>:root{--bg:#fff;--fg:#1e293b;--panel:#f6f8fb;--line:#dde3e9;--blue:#1767a5}html[data-theme=dark]{--bg:#14191f;--fg:#e7ebf0;--panel:#202832;--line:#394552;--blue:#78bfff}*{box-sizing:border-box}body{margin:0;font:15px/1.8 system-ui,Tahoma;background:var(--bg);color:var(--fg)}header{border-bottom:1px solid var(--line)}main{max-width:980px;margin:28px auto;padding:0 18px}article,section{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:18px;margin:16px 0}h1{font-size:26px}h2{font-size:19px;margin:0 0 12px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;margin:5px 0 12px;background:var(--bg);color:var(--fg);font:inherit}textarea{min-height:110px}button{padding:9px 16px;border:1px solid var(--line);border-radius:7px;background:var(--blue);color:white;cursor:pointer}button:disabled{opacity:.5}small,.muted{color:gray}a{color:var(--blue)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}#notice{min-height:25px}footer{padding:20px} .comment{border-top:1px solid var(--line);padding:10px 0}#feed article h2{overflow-wrap:anywhere}</style></head><body><header></header><main><h1>مجتمع ARBNT</h1><p class="muted">منشورات وردود حقيقية محفوظة على السيرفر في ملفات JSON، دون قاعدة بيانات.</p><p id="notice" role="status"></p><section id="loginPanel"><h2>دخول المدير</h2><form id="loginForm"><label>اسم المستخدم<input name="username" required autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button>دخول</button></form></section><section id="editor" class="hidden"><div class="row"><strong id="welcome"></strong><button id="logout" type="button">خروج</button></div><h2>منشور جديد</h2><form id="postForm"><label>العنوان<input name="title" maxlength="180" required></label><label>المحتوى<textarea name="text" maxlength="8000" required></textarea></label><button>نشر</button></form></section><h2>المنشورات</h2><div id="feed">جارٍ التحميل…</div><div class="row"><button id="previous" type="button">السابق</button><span id="pages"></span><button id="next" type="button">التالي</button></div></main><footer></footer><script src="assets/shell.js"></script><script src="assets/community.js"></script></body></html>
